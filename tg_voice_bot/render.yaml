services:
  - type: web
    name: agrigat-ostin
    runtime: docker
    dockerfilePath: ./deploy/Dockerfile
    dockerContext: .
    # XTTS v2 в режиме int8/bf16 + 2 потока укладывается в 2 ГБ Standard.
    # Если в логах MemoryError — поставить plan: pro (8 ГБ, $85), это гарантия.
    plan: standard
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # auto — перебор int8 -> bf16 -> fp32 по мере нехватки памяти
      - key: MITINI_MODE
        value: auto
      - key: MITINI_THREADS
        value: "2"
      - key: MITINI_MAX_CHARS
        value: "300"
      - key: MALLOC_ARENA_MAX
        value: "2"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TZ
        value: Europe/Moscow
    # Модель XTTS (~2 ГБ) не перекачивается при каждом рестарте
    disk:
      name: models
      mountPath: /opt/render/project/src/data
      sizeGB: 5
